info:
  name: List reviews
  type: http
  seq: 5

http:
  method: GET
  url: "{{host}}/reviews?page=1&size=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: size
      value: "10"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
